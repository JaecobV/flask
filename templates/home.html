{% extends "layout.html" %}
{% block body %}
<!--home page goes here-->
<!--search bar-->
<div class="topnav">
  <a class="active" href="#home">Home</a>
  <input type="text" placeholder="Search..">
</div>
<!--3 column grid-->
 <div class="three-column">
    {% for Group in results %}
    <a href="{{url_for('Group', id=Group[0])}}">
        <div class="w3-card-4 card">
            <!--the name then the image-->
            <h1>{{ Group[1] }}</h1>
            <img src="{{ Group[4] }}" alt="{{ Group[1] }}">
        </div>
    </a>
    {% endfor %}
 </div>
{% endblock %}
