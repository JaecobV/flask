{% extends "layout.html" %}

{% block body %}

<h1>Entertainment Companies</h1>

<div class="three-column">

{% for company in companies %}

    <a href="/company/{{ company[0] }}" class="card-link">
        <div class="w3-card-4 card">
            <img src="{{ company[2] }}" alt="{{ company[1] }}">
        </div>
    </a>

{% endfor %}

</div>

{% endblock %}
